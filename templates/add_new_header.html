    <!-- header -->
    <header
      class="bg-white shadow-lg w-full h-auto flex flex-col sm:flex-row justify-between items-center p-5 mb-7"
    >
      <div class="flex items-center">
        <h1 class="text-red-600 font-bold text-[40px]" style="color:red">Raijin ToDo</h1>
      </div>

      {% block button_change%}
      <div class="flex items-center mt-4 sm:mt-0 gap-2">
        <a
          class="bg-red-600 py-2 px-4 text-white font-semibold rounded-2xl text-lg mt-4 flex items-center gap-2"
          href="{% url 'add_task' %}"
          ><i class="bx bxs-plus-circle bx-sm"></i> Add New</a
        >
        <form action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button
          class="bg-blue-600 py-2 px-4 text-white font-semibold rounded-2xl text-lg mt-4 flex items-center gap-2"
          type="submit"
          > Logout</button
          >
        </form>
      </div>
      {%endblock%}
    </header>
